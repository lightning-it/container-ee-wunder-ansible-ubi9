# yamllint disable rule:truthy rule:line-length
---
name: MLX-90 evidence-bound collection update

on:
  workflow_dispatch:
    inputs:
      evidence_url:
        description: HTTPS URL of the signed producer evidence asset
        required: true
        type: string
      evidence_sha256:
        description: Immutable sha256 digest including the sha256 prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mlx90-security-release-update
  queue: max
  cancel-in-progress: false

jobs:
  create-update:
    name: Create exact-main security update
    if: >-
      github.actor == 'lightning-it-release-automation[bot]'
      && github.repository == 'lightning-it/container-ee-wunder-ansible-ubi9'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate the evidence pointer contract
        env:
          EVIDENCE_DIGEST: ${{ inputs.evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_URL" =~ ^https://github\.com/lightning-it/ansible-collection-supplementary/releases/download/[^/?#]+/[^/?#]+$ ]]
          [[ "$EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Resolve the exact live main head
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$main_sha" >>"$GITHUB_OUTPUT"

      - name: Mint the read-only producer evidence token
        id: producer-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ansible-collection-supplementary
          permission-contents: read

      - name: Verify the exact producer evidence token scope
        env:
          APP_INSTALLATION_ID: ${{ steps.producer-app.outputs.installation-id }}
          APP_SLUG: ${{ steps.producer-app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.producer-app.outputs.token }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = "lightning-it-release-automation"
          test "$APP_INSTALLATION_ID" = "148019054"
          actual_repositories="$(
            gh api --paginate "installation/repositories?per_page=100" \
              | jq -sc '[.[].repositories[].full_name] | sort | unique'
          )"
          test "$actual_repositories" = \
            '["lightning-it/ansible-collection-supplementary"]'

      - name: Mint the least-privilege release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: container-ee-wunder-ansible-ubi9
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve the exact release App identity
        id: release-bot
        env:
          APP_INSTALLATION_ID: ${{ steps.release-app.outputs.installation-id }}
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = "lightning-it-release-automation"
          test "$APP_INSTALLATION_ID" = "148019054"
          bot_json="$(gh api "users/${APP_SLUG}%5Bbot%5D")"
          login="$(jq -r '.login // ""' <<<"$bot_json")"
          bot_id="$(jq -r '.id // ""' <<<"$bot_json")"
          test "$login" = "lightning-it-release-automation[bot]"
          [[ "$bot_id" =~ ^[0-9]+$ ]]
          actual_repositories="$(
            gh api --paginate "installation/repositories?per_page=100" \
              | jq -sc '[.[].repositories[].full_name] | sort | unique'
          )"
          jq -e \
            --argjson actual "$actual_repositories" '
              $actual == [
                "lightning-it/container-ee-wunder-ansible-ubi9"
              ]
            ' <<<"{}" >/dev/null
          echo "login=$login" >>"$GITHUB_OUTPUT"
          echo "email=${bot_id}+${login}@users.noreply.github.com" >>"$GITHUB_OUTPUT"

      - name: Checkout the attested exact main head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.main.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Download and validate approved producer evidence
        id: evidence
        env:
          BASE_SHA: ${{ steps.main.outputs.sha }}
          EVIDENCE_DIGEST: ${{ inputs.evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
          GH_TOKEN: ${{ steps.producer-app.outputs.token }}
        run: |
          set -euo pipefail
          prefix="https://github.com/lightning-it/ansible-collection-supplementary/releases/download/"
          remainder="${EVIDENCE_URL#"$prefix"}"
          producer_tag="${remainder%%/*}"
          test "$EVIDENCE_URL" = \
            "${prefix}${producer_tag}/security-release-evidence.json"
          [[ "$producer_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release="$(gh api \
            "repos/lightning-it/ansible-collection-supplementary/releases/tags/${producer_tag}")"
          jq -e --arg tag "$producer_tag" '
            .tag_name == $tag
            and .draft == false
            and .prerelease == false
            and (.id | type == "number" and . > 0)
          ' <<<"$release" >/dev/null
          release_id="$(jq -er .id <<<"$release")"
          producer_sha="$(gh api \
            "repos/lightning-it/ansible-collection-supplementary/commits/${producer_tag}" \
            --jq .sha)"
          [[ "$producer_sha" =~ ^[0-9a-f]{40}$ ]]
          asset_pages="$(gh api --paginate --slurp \
            "repos/lightning-it/ansible-collection-supplementary/releases/${release_id}/assets?per_page=100")"
          assets="$(jq '[.[][]]' <<<"$asset_pages")"
          evidence_dir="${RUNNER_TEMP:?}/mlx90-producer-evidence"
          install -d -m 0700 "$evidence_dir"
          download_asset() {
            local name="$1" output="$2" asset_id
            asset_id="$(jq -er --arg name "$name" '
              [.[] | select(.name == $name and .state == "uploaded")]
              | if length == 1 then .[0].id else error("asset is missing or ambiguous") end
            ' <<<"$assets")"
            gh api --header 'Accept: application/octet-stream' \
              "repos/lightning-it/ansible-collection-supplementary/releases/assets/${asset_id}" \
              >"$output"
            test -s "$output"
          }
          jq -e --arg url "$EVIDENCE_URL" '
            [.[] | select(.name == "security-release-evidence.json")]
            | length == 1 and .[0].browser_download_url == $url
          ' <<<"$assets" >/dev/null
          download_asset security-release-evidence.json \
            "$evidence_dir/security-release-evidence.json"
          download_asset SHA256SUMS "$evidence_dir/SHA256SUMS"
          download_asset SHA256SUMS.sigstore.json \
            "$evidence_dir/SHA256SUMS.sigstore.json"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          requirements_blob="$(git rev-parse \
            "${BASE_SHA}:collections/requirements-base.yml")"
          [[ "$requirements_blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          test "$(git cat-file -t "$requirements_blob")" = blob
          test "$(git cat-file blob "$requirements_blob" \
            | git hash-object --stdin)" = "$requirements_blob"
          test "$(git hash-object --no-filters -- \
            collections/requirements-base.yml)" = "$requirements_blob"
          requirements_digest="sha256:$(git cat-file blob \
            "$requirements_blob" | sha256sum | awk '{print $1}')"
          [[ "$requirements_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 scripts/security-release-consumer.py prepare \
            --evidence "$evidence_dir/security-release-evidence.json" \
            --evidence-url "$EVIDENCE_URL" \
            --evidence-digest "$EVIDENCE_DIGEST" \
            --checksums "$evidence_dir/SHA256SUMS" \
            --checksums-bundle "$evidence_dir/SHA256SUMS.sigstore.json" \
            --producer-workflow-sha "$producer_sha" \
            --base-sha "$BASE_SHA" \
            --requirements collections/requirements-base.yml \
            --requirements-digest "$requirements_digest" \
            --receipt .lit/security-release-receipt.json
          python3 scripts/security-release-consumer.py verify-assets \
            --evidence "$evidence_dir/security-release-evidence.json" \
            --evidence-url "$EVIDENCE_URL" \
            --checksums "$evidence_dir/SHA256SUMS" \
            --checksums-bundle "$evidence_dir/SHA256SUMS.sigstore.json" \
            --producer-workflow-sha "$producer_sha" \
            --output "$evidence_dir/assets"
          evidence_id="$(jq -r '.metadata.id' \
            "$evidence_dir/security-release-evidence.json")"
          version="$(jq -r '.artifact.version' \
            "$evidence_dir/security-release-evidence.json")"
          branch_id="$(tr '[:upper:]' '[:lower:]' <<<"$evidence_id" | tr -c 'a-z0-9._-' '-')"
          branch_id="${branch_id%-}"
          test -n "$branch_id"
          {
            echo "id=$evidence_id"
            echo "version=$version"
            echo "branch=security/mlx90-${branch_id}"
          } >>"$GITHUB_OUTPUT"

      - name: Prove the update diff is narrowly bounded
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | LC_ALL=C sort -u
          )
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort -u >/tmp/changed
          printf '%s\n' \
            .lit/security-release-receipt.json \
            collections/requirements-base.yml | sort -u >/tmp/allowed
          cmp /tmp/allowed /tmp/changed
          git add --intent-to-add -- .lit/security-release-receipt.json
          git diff --check

      - name: Create the App-authored security update pull request
        env:
          APP_EMAIL: ${{ steps.release-bot.outputs.email }}
          APP_LOGIN: ${{ steps.release-bot.outputs.login }}
          BASE_SHA: ${{ steps.main.outputs.sha }}
          BRANCH: ${{ steps.evidence.outputs.branch }}
          EVIDENCE_DIGEST: ${{ inputs.evidence_sha256 }}
          EVIDENCE_ID: ${{ steps.evidence.outputs.id }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.evidence.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          title="fix(security): consume ${EVIDENCE_ID}"
          commit_message="$(printf '%s\n\nSecurity-Evidence-SHA256: %s\n\nSecurity-Base-SHA: %s' \
            "$title" "$EVIDENCE_DIGEST" "$BASE_SHA")"
          body="$(printf '%s\n\n%s %s. %s %s' \
            "Evidence: ${EVIDENCE_URL}" \
            "The only requested dependency change is lit.supplementary" "$VERSION" \
            "The collection digest and all producer assurance references are pinned in the receipt." \
            "The MLX-90 guard validates the live main parent and exact diff before a final live-policy protected merge.")"
          git config user.name "$APP_LOGIN"
          git config user.email "$APP_EMAIL"
          git add .lit/security-release-receipt.json collections/requirements-base.yml
          expected_tree="$(git write-tree)"
          [[ "$expected_tree" =~ ^[0-9a-f]{40}$ ]]
          gh auth setup-git
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          ref="refs/heads/${BRANCH}"
          # shellcheck disable=SC2016
          branch_sha="$(
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$ref:String!){repository(owner:$owner,name:$name){ref(qualifiedName:$ref){target{... on Commit{oid}}}}}' \
              -f owner="$owner" \
              -f name="$name" \
              -f ref="$ref" \
              --jq '.data.repository.ref.target.oid // ""'
          )"
          if [ -n "$branch_sha" ]; then
            [[ "$branch_sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin \
              "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            test "$(git rev-parse "refs/remotes/origin/${BRANCH}")" = "$branch_sha"
          else
            git switch --create "$BRANCH"
            git commit \
              -m "$title" \
              -m "Security-Evidence-SHA256: ${EVIDENCE_DIGEST}" \
              -m "Security-Base-SHA: ${BASE_SHA}"
            test "$(git rev-parse HEAD^)" = "$BASE_SHA"
            branch_sha="$(git rev-parse HEAD)"
            git push --set-upstream origin "$BRANCH"
          fi
          [[ "$branch_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-list --count "${BASE_SHA}..${branch_sha}")" -eq 1
          test "$(git rev-parse "${branch_sha}^")" = "$BASE_SHA"
          test "$(git show -s --format=%T "$branch_sha")" = "$expected_tree"
          commit="$(gh api "repos/${REPOSITORY}/commits/${branch_sha}")"
          jq -e \
            --arg app "$APP_LOGIN" \
            --arg base "$BASE_SHA" \
            --arg message "$commit_message" \
            --arg tree "$expected_tree" '
              (.parents | length) == 1
              and .parents[0].sha == $base
              and .author.login == $app
              and .committer.login == $app
              and .commit.message == $message
              and .commit.tree.sha == $tree
            ' <<<"$commit" >/dev/null
          live_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main" = "$BASE_SHA"
          # shellcheck disable=SC2016
          live_branch="$(
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$ref:String!){repository(owner:$owner,name:$name){ref(qualifiedName:$ref){target{... on Commit{oid}}}}}' \
              -f owner="$owner" \
              -f name="$name" \
              -f ref="$ref" \
              --jq '.data.repository.ref.target.oid // ""'
          )"
          test "$live_branch" = "$branch_sha"
          pr_pages="$(
            gh api --method GET --paginate --slurp \
              "repos/${REPOSITORY}/pulls" \
              -f state=all \
              -f head="${owner}:${BRANCH}" \
              -f base=main \
              -f per_page=100
          )"
          prs="$(jq '[.[][]]' <<<"$pr_pages")"
          jq -e 'type == "array"' <<<"$prs" >/dev/null
          pr_count="$(jq 'length' <<<"$prs")"
          if [ "$pr_count" -eq 0 ]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body "$body" >/dev/null
            pr_pages="$(
              gh api --method GET --paginate --slurp \
                "repos/${REPOSITORY}/pulls" \
                -f state=all \
                -f head="${owner}:${BRANCH}" \
                -f base=main \
                -f per_page=100
            )"
            prs="$(jq '[.[][]]' <<<"$pr_pages")"
            pr_count="$(jq 'length' <<<"$prs")"
          fi
          test "$pr_count" -eq 1
          jq -e \
            --arg app "$APP_LOGIN" \
            --arg base "$BASE_SHA" \
            --arg body "$body" \
            --arg branch "$BRANCH" \
            --arg head "$branch_sha" \
            --arg repo "$REPOSITORY" \
            --arg title "$title" '
              .[0].state == "open"
              and .[0].draft == false
              and .[0].user.login == $app
              and .[0].base.ref == "main"
              and .[0].base.sha == $base
              and .[0].head.ref == $branch
              and .[0].head.sha == $head
              and .[0].head.repo.full_name == $repo
              and .[0].title == $title
              and .[0].body == $body
            ' <<<"$prs" >/dev/null
